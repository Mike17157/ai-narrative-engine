[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom"
version = "0.1.0"
description = "Declarative pipeline engine for chat + image generation. Chat models and image models are fully decoupled, independently-configured resources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    # Phase 2 (API) — kept here so the engine and server share one env:
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psutil>=5.9",   # CPU/RAM stats for the Activity panel
]

[project.scripts]
loom = "loom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["loom"]
