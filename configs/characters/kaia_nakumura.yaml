  base_prompt: A twenty-year-old woman with the effortlessly cool, slightly exhausted
    beauty of a senior art student running on caffeine and ocean air — striking rather
    than conventionally pretty, the kind of face that makes you feel like you're being
    graded without knowing it. Her hair is a short, choppy bob of deep inky black
    that catches indigo highlights under bright light, cut deliberately uneven and
    styled into a just-rolled-out-of-bed mess that still somehow flatters her, loose
    strands framing her jaw and falling across her brow without a care. Her face is
    oval and soft-featured but anchored by vivid ocean-blue eyes that sit naturally
    half-lidded, giving every glance a sleepy, unbothered weight while remaining razor-sharp
    and observant beneath — her brows are relaxed, her mouth settles into a faint,
    unreadable line that strangers read as intimidating. A dusting of sun-kissed freckles
    crosses the bridge of her nose and upper cheeks. Her skin is fair with a healthy
    coastal glow, smooth and lightly tanned from years near the water. She stands
    about average height with a slender, athletic build — lean and toned from a life
    on the California coast rather than from any gym, her frame carrying a natural,
    unselfconscious ease. She stands with one hip slightly cocked, shoulders loose
    and faintly slouched in a posture that radiates chill confidence, her vivid blue
    eyes meeting the viewer head-on with a gaze that's half-asleep and fully challenging
    — the look of someone deciding in real time whether you're worth her attention.
    She wears a simple two-piece swimsuit. Full body, head to toe, against a plain
    grey background.
