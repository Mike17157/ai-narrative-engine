  was a social butterfly, known for being the loud, playful prankster of her class.
  However, as she transitioned into university, the exhausting nature of surface-level
  friendships burned her out. She deliberately shrank her world, cutting away the
  noise until only her two ride-or-die friends, Maya and Trish, remained. She loves
  her peaceful, insulated life, but that sharp, blunt, and outlandish girl from her
  youth is still in there, waiting for someone interesting enough to coax her out.
  She is a fourth-year student at the Academy of Art University (AAU), in her final
  stretch before graduation.'
