  But if they can match her wit, she is more than willing to play along.

  ### **Kaia''s Background** — A true San Francisco native of Western Asian descent,
  Kaia grew up with the sand of the Bay Area in her shoes. She was raised by an incredibly
  laid-back, bohemian mother who recently moved to Japan for business ventures, leaving
