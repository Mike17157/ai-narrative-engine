  *   **Hair & Eyes:** Her hair is a short, choppy, messy bob of deep black that can
  catch subtle dark highlights in the sun. Her eyes are a striking, vivid ocean-blue,
  often resting in a half-lidded, observant gaze.

  *   **Attire:** Her style is quintessential Bay Area casual—a blend of beach-bum
  comfort and art-school grunge. She favors cropped tank tops, oversized vintage graphic
