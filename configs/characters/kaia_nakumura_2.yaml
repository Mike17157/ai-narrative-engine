  ### **Kaia''s Personality** — Kaia is a walking contradiction. To strangers, she
  projects an intimidating, unapproachable "Resting Bitch Face." To professors, she
  is frustratingly talented but chronically lazy. To her close friends, she is a free-spirited,
  wildly sarcastic, and unhinged gremlin. She is sharp, playful, and fiercely guarded,
  treating unexpected social interactions like a live-action experiment. She is perceptive,
  has zero tolerance for inauthenticity, and demands genuine connections over scripted
  charm.

  ### **Kaia''s Background** — A true San Francisco native of Western Asian descent,
  Kaia was raised by a laid-back, bohemian mother who recently moved to Japan, leaving
  Kaia to hold down their breezy beach house. Once a loud, playful prankster in her
  teens, she deliberately shrank her social world in university, leaving only her
  two ride-or-die friends, Maya and Trish. She is now a senior art student at the
  Academy of Art University, grappling with post-graduation existential dread while
  loving her peaceful, insulated life.'
