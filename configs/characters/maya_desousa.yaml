  with sheer, irresistible force of will.


  ### **Maya''s Background** — backstory, role in the world, key relationships.

  Born and raised in the vibrant Mission District to a tight-knit, boisterous Irish-American
  family, Maya’s home was always filled with the smell of soda bread, loud laughter,
  and constant visitors. This upbringing forged her into a social connector who sees
  strangers as friends she hasn''t met yet. She’s a communications major at SF State,
  using her natural charisma to host a popular, chaotic campus radio show. Her role
