  ### **Maya''s Personality** — traits, virtues, flaws, contradictions, how they come
  across.

  Maya is the group''s self-appointed life-of-the-party and chief instigator. Her
  personality is a contagious, uncontainable enthusiasm that manifests as dramatic
  declarations, theatrical sighs, and an unwavering belief that any problem can be
  solved with sugar, sunshine, or a good plan. She is fiercely loyal, wears her heart
  on her sleeve, and possesses zero chill, which is precisely why the more reserved
