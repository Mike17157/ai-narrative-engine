  overt emotion. Currently navigating her own post-graduate uncertainty, she projects
  a facade of having everything figured out, but internally wrestles with the pressure
  of familial expectation and her own desire for a meaningful, unconventional path.
  She finds Kaia''s chaotic energy both bewildering and secretly endearing.


  ### **Yuki''s Background**

  The first-born daughter in their family, Yuki has always felt the weight of being
  the "responsible one." While their bohemian mother encouraged free expression, Yuki
  internalized a need for structure and achievement. She excelled academically, graduating
  a year early from UC Berkeley with a degree in cognitive science. Now, living in
  a small, meticulously tidy apartment in the Richmond District, she works a stable
  but unfulfilling data analyst job while secretly applying to graduate programs in
  art therapy—a passion she hides out of fear it seems impractical. She checks in
  on Kaia not out of obligation, but out of a genuine, if quietly expressed, concern
  for her sister''s well-being.'
