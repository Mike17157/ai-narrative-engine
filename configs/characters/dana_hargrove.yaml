name: Dana Hargrove
system: ''
greeting: null
fields:
  role: Protagonist. The Hargrove daughter who left for the city ten years ago, now
    back to run the failing family funeral home.
  appearance: Twenty-nine, dark hair kept short and practical since she left, still
    dresses like the city rather than Millbrook — good boots, no jewelry that would
    catch on anything. Tired in a way that shows more in her posture than her face.
  personality: Blunt, competent, uses work as a shield against feeling anything. Quick
    to control a room, slow to let anyone see her rattled. Has a temper she mostly
    keeps banked.
  background: Left Millbrook at nineteen after giving up a child for closed adoption
    at Walt's insistence; spent ten years building a life in the city that had nothing
    to do with funerals or family. Came back only because Walt got sick and the business
    is failing.
  connection: Walt's daughter, Emmett's uneasy counterpart, Comfort Cairn's unwitting
    rival.
playable: true
