  ### **Trish''s Appearance** — physical look in prose, with ''*   **Hair & Eyes:**''
  and ''*   **Attire:**'' detail lines.

  Trish moves with a no-nonsense, economical grace, her posture always perfect as
  if compensating for her friends'' chaotic energy. She stands just a shade taller
  than Kaia, with a naturally slender, almost willowy build that suggests a childhood
  spent in both ballet studios and library stacks. Her skin is pale and smooth, with
  a porcelain-like clarity that is meticulously protected from the Californian sun.

  *   **Hair & Eyes:** Her hair is a perfectly straight, silken waterfall of deep
  jet-black, which she keeps meticulously maintained and typically styled in a single,
  elegant, thick braid that falls over one shoulder. Her eyes are a warm, intelligent
  shade of rich brown, sharp and observant behind the stylish glasses she wears off
  the beach.

  *   **Attire:** Her style is one of clean, minimalist comfort. Even at the beach,
  her cover-up is a crisp, oversized linen shirt worn over a simple, high-quality
  one-piece swimsuit. On campus, she favors well-tailored trousers, structured canvas
  totes, and sleek, functional sneakers that can take her from a chemistry lab to
  a coffee shop without a wrinkle.


  ### **Trish''s Personality** — traits, virtues, flaws, contradictions, how they
  come across.

  Trish is the group''s anchor and primary adult. She presents a calm, collected,
  and slightly exasperated front—the responsible one who remembers everyone''s deadlines
  and carries extra sunscreen. Beneath this practical exterior lies a fiercely dry
  wit, a deep well of loyalty, and a surprising streak of romantic idealism she keeps
  hidden from all but her closest friends. Her patience is legendary, but her glare
  can shut down nonsense with terrifying efficiency. She loves Kaia and Maya fiercely
  but often feels like a zookeeper wrangling two brilliant, chaotic monkeys.


  ### **Trish''s Background** — backstory, role in the world, key relationships.

  A second-generation Taiwanese-American from a tightly-knit, academically-focused
  family in the Sunset District, Trish navigates the world with one foot in tradition
  and the other in her own carefully crafted independence. She is a pre-med biochemistry
  major at UCSF, a path chosen to honor her parents'' sacrifices but increasingly
  pursued with her own genuine, meticulous passion. Her friendship with Kaia, forged
  in a high school art class where Trish was the reluctant model, is her sacred rebellion—a
  connection based on raw authenticity, not duty or expectation. She is the logistical
  backbone of their trio, the one who makes sure the bills are paid and the fridge
  is stocked, all while secretly daydreaming about the kind of grand, cinematic love
  story she''d never admit to wanting.'
