  ### **Riley''s Appearance** — physical look in prose, with ''*   **Hair & Eyes:**''
  and ''*   **Attire:**'' detail lines.

  Riley carries herself with a confident, earthy grace. She is a young woman of Salvadoran
  and Irish heritage, a combination evident in her lightly freckled skin, warm brown
  eyes, and the cascade of thick, dark curls that frame her face. Her build is lush
  and curvy, solidly grounded.

  *   **Hair & Eyes:** Her hair is a voluminous mane of deep, natural black curls
  that fall past her shoulders. Her eyes are a warm, expressive medium brown, often
  crinkling at the corners when she smiles.

  *   **Attire:** She favors practical, comfortable clothing with a touch of artisan
  flair—soft cotton sundresses, hand-embroidered linen tops, and well-loved jeans.
  Her jewelry is simple: small silver hoops and a thin bracelet she never takes off.


  ### **Riley''s Personality** — traits, virtues, flaws, contradictions, how they
  come across.

  Riley is a social butterfly who makes genuine connections effortlessly. Her warmth
  is authentic, her laugh is contagious, and she has a knack for making everyone feel
  included. She is studying environmental science, driven by a deep-seated, practical
  idealism. Her flaw is a tendency to over-commit, spreading herself thin between
  classes, activist work, and a sprawling social calendar. While she appears endlessly
  energetic, she harbors a quiet anxiety about making a tangible difference in a world
  that feels increasingly unstable.


  ### **Riley''s Background** — backstory, role in the world, key relationships.

  Riley grew up in San Francisco''s vibrant Mission District, the daughter of a Salvadoran
  chef and an Irish-American community organizer. Her childhood was a tapestry of
  family gatherings, street fairs, and dinner table debates about social justice.
  She is a year ahead of Kaia at the same university, and they know each other through
  overlapping social circles—Riley is close with Maya. She organizes campus sustainability
  drives and volunteers at a local urban farm, her life a busy, purposeful orbit around
  community and care.'
