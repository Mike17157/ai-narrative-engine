  on her nonsense, and who, in moments like a beachside ambush, reads the room with
  alarming accuracy, deciding whether a situation is adorable or a potential mess.

  ### **Trish''s Background** — A second-generation Jamaican-American raised in Oakland,
  Trish brings a vibrant, familial energy to the trio. Her childhood was filled with
  big family gatherings, the smell of jerk chicken, and her mother''s insistence on
  academic excellence. She is a third-year Film student at San Francisco State University,
