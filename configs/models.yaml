# Named resources a pipeline references by key. Text entries are chat models;
# image entries are ComfyUI *workflows* (think of them as workflows, not
# "models" — each bundles a checkpoint + graph and is configured under the
# Images → Configure tab).
#
# This is where the SillyTavern decoupling becomes concrete: `opus` (the chat
# brain, a cloud LLM) and `anima` (an image workflow, a local ComfyUI graph)
# are independent entries. Swap either without touching the other or any
# character.
#
# The image pipeline is Anima-only (Qwen-Image natural-language DiT). All
# image workflows load the Anima UNet (node 4) + a separate Qwen CLIP
# (node 11) + Qwen VAE (node 12). Prompts are natural-language prose (see
# loom/server/services/prompts.py), injected at node 6.
models:
  opus:
    provider: anthropic
    kind: text
    options:
      model: claude-opus-4-8      # current most-capable Claude model
      max_tokens: 2048
      effort: high                # thinking depth (low|medium|high|xhigh|max)
      thinking: adaptive

  # A cheaper/faster chat alternative you can point a pipeline at instead.
  haiku:
    provider: anthropic
    kind: text
    options:
      model: claude-haiku-4-5
      max_tokens: 1024
      thinking: disabled

  # Workflow: Anima (CircleStone 2B anime DiT). Loads a UNet (node 4) + a
  # separate Qwen CLIP (node 11) + Qwen VAE (node 12), per the model's reference
  # workflow. Positive prompt injects at node 6; output node 9. Used for SCENES
  # and chat pictures (full backgrounds kept). Swap the unet_name (node 4) to
  # anisnuff / hosekiLustrousmixAnima as desired.
  anima:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/anima_basic_api.json
      inputs:
        positive: { node: "6", field: "text" }
      output_node: "9"
      timeout_s: 600          # Anima DiT cold start loads ~6 GB from the volume

  # Workflow: Anima CHARACTER cutout — the anima graph + Inspyrenet background
  # removal (node 201) so the subject is cut from anima's busy, non-uniform
  # backgrounds (segmentation, not colour-key). Used for the base/sprite roles
  # so sprites composite cleanly onto scenes.
  anima_cutout:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/anima_cutout_api.json
      inputs:
        positive: { node: "6", field: "text" }
      output_node: "201"      # easy imageRemBg → transparent PNG
      timeout_s: 600          # Anima DiT cold start loads ~6 GB from the volume

  # Workflow: Anima at a portrait ratio for standalone background plates and
  # scene/chat renders that want a taller frame.
  anima_background:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/anima_background_api.json
      inputs:
        positive: { node: "6", field: "text" }
      output_node: "9"
      timeout_s: 600          # Anima DiT cold start loads ~6 GB from the volume
