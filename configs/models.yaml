# Named resources a pipeline references by key. Text entries are chat models;
# image entries are ComfyUI *workflows* (think of them as workflows, not
# "models" — each bundles a checkpoint + graph and is configured under the
# Images → Configure tab).
#
# This is where the SillyTavern decoupling becomes concrete: `opus` (the chat
# brain, a cloud LLM) and `krea2_turbo` (an image workflow, a local ComfyUI
# graph) are independent entries. Swap either without touching the other or
# any character.
#
# The image pipeline is Krea2-only (Qwen-Image arch, Gemma-optimized prompts).
# LoRA customization is applied at render time via configs/image_presets.json
# (see loom/comfy/stack.py) — independent of which krea2 workflow variant runs.
models:
  opus:
    provider: anthropic
    kind: text
    options:
      model: claude-opus-4-8      # current most-capable Claude model
      max_tokens: 2048
      effort: high                # thinking depth (low|medium|high|xhigh|max)
      thinking: adaptive

  # Good balance of quality and cost for story pipeline stages.
  sonnet:
    provider: anthropic
    kind: text
    options:
      model: claude-sonnet-4-6
      max_tokens: 2048
      thinking: disabled

  # A cheaper/faster chat alternative you can point a pipeline at instead.
  haiku:
    provider: anthropic
    kind: text
    options:
      model: claude-haiku-4-5
      max_tokens: 1024
      thinking: disabled

  # The high-level Story Agent has a named gateway profile rather than passing
  # this provider-qualified ID through whichever chat connection is active.
  # `deepseek/deepseek-v4-pro` is the configured OpenRouter model identifier;
  # it therefore requires OPENROUTER_API_KEY (or an explicit api_key option),
  # not a direct DeepSeek connection.  story_builder.json may fall back to the
  # active text connection when that gateway credential is absent.
  story_agent_deepseek_v4_pro:
    provider: openrouter
    kind: text
    options:
      base_url: https://openrouter.ai/api/v1
      model: deepseek/deepseek-v4-pro
      max_tokens: 8192
      # The interactive Architect must return before its browser surface gives
      # up.  No automatic retry means one author action is one model attempt;
      # an explicit retry or model change remains the author's choice.
      request_timeout_s: 32
      max_retries: 0

  # Direct DeepSeek is a separate route with its native model id.  It is kept
  # as an intentional swap target; OpenAICompatProvider reads DEEPSEEK_API_KEY
  # when this base URL is used.
  story_agent_deepseek_chat:
    provider: deepseek
    kind: text
    options:
      base_url: https://api.deepseek.com
      model: deepseek-chat
      max_tokens: 8192

  # --------------------------------------------------------------------------- #
  # Krea2 — Gemma-optimized prompt pipeline. A built-in TextGenerate node runs the
  # local uncensored Gemma LLM (text_encoders/gemma-4-E4B-it-ultra-uncensored-
  # heretic-fp8) over the raw description and emits one optimized natural-language
  # image prompt; that prompt feeds the render. Loom injects the description at the
  # {{image}} token inside TextGenerate.prompt (node 21), so the instruction stays
  # baked in the workflow. The instruction prompt is tuned for Gemma's chat
  # template (use_default_template=false, explicit <start_of_turn> turns).
  #
  # RENDER BRANCH: currently Flux Klein (present + proven). The real Krea2 turbo
  # weights aren't on disk yet — when downloaded, swap three model names in
  # workflows/krea2_t2i_api.json:
  #   node 1 UNETLoader.unet_name -> krea2/krea2_turbo_bf16.safetensors
  #   node 2 -> CLIPLoader clip_name=qwen3vl_4b_bf16.safetensors type=qwen_image
  #   node 3 VAELoader.vae_name  -> qwen_image_vae.safetensors  (already present)
  #   (add LoraLoaderModelOnly krea2_turbo_lora_rank_64_bf16 + drop to ~8 steps)
  # The Gemma front-end (nodes 20/21) is model-agnostic and stays as-is.
  # --------------------------------------------------------------------------- #
  krea2:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_t2i_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "13"         # SaveImage
      timeout_s: 600

  # --------------------------------------------------------------------------- #
  # krea2_turbo — the REAL Krea2 Turbo (Qwen-Image arch), NVFP4 quant for Blackwell.
  # VERIFIED end-to-end: photoreal 1024² render in ~27s on the RTX 5070. Runs on the
  # Loom-managed ComfyUI 0.26 (~/ComfyUI-latest; user.yaml comfyui.main_py points there) —
  # 0.26 is required for the krea2 arch / comfy_quant NVFP4 / krea2 clip type (the Desktop
  # app's 0.22.3 can't load it). Models (all present): diffusion_models/
  # krea2TurboOfficialComfy_krea2TurboNvfp4 + text_encoders/qwen3vl_4b_fp8_scaled
  # (type=krea2) + vae/qwen_image_vae. Graph mirrors ComfyUI's official
  # image_krea2_turbo_t2i template: KSampler 8 steps / CFG 1 / euler / simple,
  # EmptyLatentImage, ConditioningZeroOut negative, + easy loraStack anchor.
  # --------------------------------------------------------------------------- #
  krea2_turbo:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_turbo_t2i_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "13"         # SaveImage
      timeout_s: 600

  # Krea2 Turbo role variants — all share the type=krea2 encoder (12-layer Qwen3-VL stack).
  krea2_turbo_character:        # tall portrait + Inspyrenet cutout (also serves sprite)
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_turbo_cutout_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "22"         # easy imageRemBg (transparent cutout)
      timeout_s: 600
  krea2_turbo_sprite:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_turbo_cutout_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "22"
      timeout_s: 600
  krea2_turbo_scene:            # landscape, no cutout
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_turbo_scene_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "13"
      timeout_s: 600
  krea2_turbo_img2img:          # init image via LoadImage, denoise 0.6
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_turbo_img2img_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "13"
      timeout_s: 600

  # Reference-grounded map renderer. Give it a town/map skeleton image and a style prompt;
  # low denoise preserves streets and landmark placement.
  krea2_turbo_map:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_turbo_map_reference_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "13"
      timeout_s: 600

  # krea2_scene — landscape (1216×832), no cutout.
  krea2_scene:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_scene_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "13"         # SaveImage
      timeout_s: 600

  # krea2_character / krea2_sprite — tall-portrait render +
  # Inspyrenet cutout (transparent PNG). One file serves both: with the Klein
  # stand-in they're identical (no FaceDetailer yet); split when real Krea2 turbo +
  # a detailer land. Aspect is baked (832×1216) — Loom's apply_latent doesn't touch
  # EmptyFlux2LatentImage, so the file owns the size.
  krea2_character:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_cutout_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "22"         # easy imageRemBg (transparent cutout)
      timeout_s: 600

  krea2_sprite:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_cutout_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "22"         # easy imageRemBg (transparent cutout)
      timeout_s: 600

  # krea2_img2img — LoadImage→VAEEncode seeds
  # the latent; SplitSigmasDenoise(0.6) sets img2img strength on the Flux2 custom
  # sampler. Loom's find_load_image_node feeds the source image at node 14.
  krea2_img2img:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_img2img_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "13"         # SaveImage
      timeout_s: 600

  # krea2_turbo_sprite_i2i — EXPRESSION sprites via img2img FROM THE OUTFIT BASE + Inspyrenet
  # cutout. The base image is the style/identity anchor (text alone plateaued at ~5% style
  # drift); denoise is set per-call by the sprite endpoint (~0.7 so the face can change).
  krea2_turbo_sprite_i2i:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_turbo_i2i_cutout_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "22"
      timeout_s: 600

  # krea2_turbo_sprite_detail — sprite render + a FaceDetailer (ImpactPack) pass that re-renders
  # the detected face at higher res for sharper, more expressive faces on small full-body sprites.
  krea2_turbo_sprite_detail:
    provider: comfyui
    kind: image
    options:
      base_url: http://127.0.0.1:8188
      workflow: ./workflows/krea2_turbo_cutout_detail_api.json
      inputs:
        positive: { node: "4", field: "text" }
      output_node: "22"
      timeout_s: 700
