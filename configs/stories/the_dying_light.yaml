name: Embergloom
premise: 'In a kingdom where magic fades like a dying ember, Eli is a young mage haunted
  by the disappearance of his father. Armed with only a vial of glowing elixirs and
  his father''s worn journal, he clings to the hope of uncovering the truth. As whispers
  of his power reach the Crown, Eli is forced to confront not only the looming threat
  of being "harvested" like his father, but also his own fears of abandonment and
  isolation. When he learns that his father''s life is bound to the land, keeping
  the kingdom alive at the cost of his own existence, Eli must choose: free his father
  and doom the kingdom, take his father''s place alone, or find a third path — one
  that risks everything to forge a new future.'
tone: Haunting, bittersweet, introspective
themes:
- Legacy
- sacrifice
- loneliness
- trust
- shared burden
