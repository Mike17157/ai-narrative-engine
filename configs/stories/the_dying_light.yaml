intended_ending: 'Eli learns his father did not die or abandon them — years ago his
  father bound his own life into the land to slow the kingdom''s magic from dying
  out; the failing ''dying light'' IS his father''s fading life, spent to keep everyone
  else alive. Eli''s mother has known all along and hid it, terrified the Crown would
  do the same to her son. The story drives toward Eli''s choice: free his father (and
  let the kingdom die faster) or take his father''s place alone. He reaches a THIRD
  answer earned by his arc (learning he doesn''t have to carry it alone): he ties
  the burden across the last handful of mages and the people themselves, breaking
  the cycle of one vanished man sacrificing everything — bittersweet, his father finally
  allowed to die, the light dimmer but shared.'
